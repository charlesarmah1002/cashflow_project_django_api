services:
  - type: web
    name: cashflow-api
    runtime: docker
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cashflow-db
          property: connectionString

databases:
  - name: cashflow-db
    plan: free